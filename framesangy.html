<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Página Principal</title>
</head>

<!-- 
  - Usamos rows="110px, *" para darle un tamaño fijo adecuado al encabezado.
  - Cambiamos frameborder y border a "0" para eliminar la raya intermedia.
  - framespacing="0" quita el espacio invisible entre marcos.
-->
<frameset rows="110px, *" frameborder="0" border="0" framespacing="0">

    <frame 
        src="angycabeza.html" 
        name="encabezado" 
        scrolling="no" 
        noresize="noresize"
    >

    <frame 
        src="principalangy.html" 
        name="menu" 
        scrolling="auto"
    >

</frameset>

</html>
