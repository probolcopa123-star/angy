<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>principalangy.html</title>

     <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #D9D9D9;
            font-family: Georgia, serif;
            color: #4A0F18;
        }

        /* BARRA SUPERIOR */

        .barra {
            width: 100%;
            height: 12px;
            background-color: #7B1E2B;
        }

        /* CONTENEDOR PRINCIPAL */

        .contenedor {
            width: 100%;
            min-height: calc(100% - 12px);
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* LOGO */

        .logo {
            width: 180px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 2px solid #7B1E2B;
        }

        /* TÍTULO */

        h1 {
            color: #7B1E2B;
            font-size: 42px;
            margin: 10px 0;
        }

        /* SUBTÍTULO */

        h2 {
            color: #4A0F18;
            font-size: 24px;
            font-weight: normal;
            margin: 15px 0 30px 0;
            font-style: italic;
        }

        /* LÍNEA DECORATIVA */

        .linea {
            width: 180px;
            height: 4px;
            background-color: #7B1E2B;
            margin: 15px 0 30px 0;
            border-radius: 3px;
        }

        /* UBICACIÓN */

        .ubicacion {
            font-size: 20px;
            color: #4A0F18;
            margin-bottom: 40px;
            max-width: 600px;
            line-height: 1.5;
        }

        /* BOTONES */

        .botones-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 700px;
        }

        .boton {
            background-color: #7B1E2B;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(123, 30, 43, 0.3);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .boton:hover {
            background-color: #922638;
            transform: scale(1.05);
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {

            h1 {
                font-size: 30px;
            }

            h2 {
                font-size: 20px;
            }

            .ubicacion {
                font-size: 17px;
            }

            .boton {
                width: 80%;
                font-size: 16px;
            }

        }

    </style>

</head>


<body>

    <div class="barra"></div>


    <div class="contenedor">


        <!-- LOGO -->

        <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQb1wIaeK2OrPbtL0wD2s20eGM-k7CU1K2UEjkvrhgSpg&s=10.png"
            alt="Logo"
            class="logo"
        >

        <h1>
            UNIDAD EDUCATIVA FISCAL<br>
            PROVINCIA BOLÍVAR
        </h1>

        <div class="linea"></div>

        <h2>
            “Inspira, supera y transforma tu camino”
        </h2>

        <p class="ubicacion">
            UBICACION: SAUCES 5 AVE ANTONIO PARRA VELASCO AREA COMUNAL
            <br>
            Guayaquil, Guayas
        </p>


        <div class="botones-container">

            <a
                href="Provincia de Bolívar.html"
                class="boton"
                target="_top"
            >
                Himno
            </a>


            <a
                href="generalangy.html"
                class="boton"
                target="_top"
            >
                Información General
            </a>


            <a
                href="academicaangy.html"
                class="boton"
                target="_top"
            >
                Información Académica
            </a>


            <a
                href="eventosangy.html"
                class="boton"
                target="_top"
            >
                Eventos
            </a>


            <a
                href="informacion deportivaangy.html"
                class="boton"
                target="_top"
            >
                Actividad Deportiva
            </a>


            <a
                href="barangy.html"
                class="boton"
                target="_top"
            >
                Bar
            </a>

            <!-- NUEVO BOTÓN: RESEÑA DE MÚSICA -->

            <a
                href="resenademusicaangy.html"
                class="boton"
                target="_top"
            >
                Reseña de Música
            </a>

        </div>


    </div>

</body>

</html>
